<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Continental 2026 - FINAL PRECISE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .shutdown-pattern {
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(239, 68, 68, 0.1) 5px, rgba(239, 68, 68, 0.1) 10px);
        }
        @media print {
            .print-hidden { display: none !important; }
            #calendarGrid { grid-template-columns: repeat(4, 1fr) !important; gap: 4px !important; }
            .month-card { break-inside: avoid; border: 1px solid #eee !important; }
        }
    </style>
</head>
<body class="bg-slate-100">

    <div class="max-w-6xl mx-auto min-h-screen flex flex-col" id="appContainer">
        
        <div class="p-4 bg-white shadow-md border-b sticky top-0 z-50 print-hidden">
            <div class="flex justify-between items-center mb-4">
                <h1 class="font-black text-xl italic uppercase text-slate-800">Continental <span class="text-orange-500">2026</span></h1>
                <div class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-[10px] font-black uppercase">Zmena <span id="activeTeamLabel">C</span></div>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-1" id="teamButtons"></div>
        </div>

        <div class="bg-white flex-grow shadow-xl">
            <div id="calendarGrid" class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>

            <div class="p-8 bg-slate-900 text-white mt-10 rounded-t-3xl print-hidden">
                <div class="grid grid-cols-2 md:grid-cols-5 gap-4 text-[10px] font-black uppercase text-center">
                    <div class="flex flex-col items-center gap-2"><div class="w-10 h-10 rounded-xl bg-[#FFD700] text-black flex items-center justify-center border-2 border-white/20 shadow-lg">R</div>Ranná</div>
                    <div class="flex flex-col items-center gap-2"><div class="w-10 h-10 rounded-xl bg-[#FF8C00] text-white flex items-center justify-center border-2 border-white/20 shadow-lg">P</div>Poobedná</div>
                    <div class="flex flex-col items-center gap-2"><div class="w-10 h-10 rounded-xl bg-[#483D8B] text-white flex items-center justify-center border-2 border-white/20 shadow-lg">N</div>Nočná</div>
                    <div class="flex flex-col items-center gap-2"><div class="w-10 h-10 rounded-xl bg-sky-400 text-black flex items-center justify-center border-2 border-black font-black">12</div>12h Smena</div>
                    <div class="flex flex-col items-center gap-2"><div class="w-10 h-10 rounded-xl bg-red-600 text-white flex items-center justify-center border-2 border-white/20 font-black text-xl">★</div>Sviatok</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTeam = 'C';
        
        // 3R - 4N - 3V - 5P - 2V - 4R - 3N - 4V
        const cycle = [
            { t: 'R' }, { t: 'R' }, { t: 'R' }, 
            { t: 'N' }, { t: 'N' }, { t: 'N' }, { t: 'N' }, 
            { t: 'V' }, { t: 'V' }, { t: 'V' }, 
            { t: 'P' }, { t: 'P' }, { t: 'P' }, { t: 'P' }, { t: 'P' }, 
            { t: 'V' }, { t: 'V' }, 
            { t: 'R' }, { t: 'R' }, { t: 'R' }, { t: 'R' }, 
            { t: 'N' }, { t: 'N' }, { t: 'N' }, 
            { t: 'V' }, { t: 'V' }, { t: 'V' }, { t: 'V' }
        ];

        // Offset C nastavený tak, aby 1.1. bolo V a 2.1. R (podľa papiera)
        const teamOffsets = { A: 14, B: 7, C: 27, D: 21 };

        const months = [
            { n: "Január", d: 31, s: 3, c: "bg-blue-50 text-blue-700" },
            { n: "Február", d: 28, s: 6, c: "bg-blue-50 text-blue-700" },
            { n: "Marec", d: 31, s: 6, c: "bg-emerald-50 text-emerald-700" },
            { n: "Apríl", d: 30, s: 2, c: "bg-emerald-50 text-emerald-700" },
            { n: "Máj", d: 31, s: 4, c: "bg-emerald-50 text-emerald-700" },
            { n: "Jún", d: 30, s: 0, c: "bg-orange-50 text-orange-700" },
            { n: "Júl", d: 31, s: 2, c: "bg-orange-50 text-orange-700" },
            { n: "August", d: 31, s: 5, c: "bg-orange-50 text-orange-700" },
            { n: "September", d: 30, s: 1, c: "bg-amber-50 text-amber-800" },
            { n: "Október", d: 31, s: 3, c: "bg-amber-50 text-amber-800" },
            { n: "November", d: 30, s: 6, c: "bg-amber-50 text-amber-800" },
            { n: "December", d: 31, s: 1, c: "bg-rose-50 text-rose-700" }
        ];

        const holidays = ["0-1", "0-6", "3-3", "3-6", "4-1", "4-8", "6-5", "7-29", "8-1", "8-15", "10-1", "10-17", "11-24", "11-25", "11-26"];
        const paydays = ["0-9", "1-6", "2-6", "3-9", "4-8", "5-5", "6-7", "7-7", "8-7", "9-7", "10-6", "11-7"];

        function render() {
            document.getElementById('activeTeamLabel').innerText = currentTeam;
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const startDate = new Date(2026, 0, 1);

            months.forEach((m, mIdx) => {
                let totalFPC = 0;
                const monthDiv = document.createElement('div');
                monthDiv.className = "month-card bg-white border border-slate-100 rounded-3xl overflow-hidden shadow-sm flex flex-col";
                
                let h = `<div class="flex justify-between items-center px-4 py-2 border-b-2 ${m.c}"><h3 class="font-black uppercase text-[10px] tracking-widest">${m.n}</h3><div class="text-[9px] font-black bg-white/60 px-2 py-0.5 rounded-lg border border-black/5 shadow-sm" id="h-${mIdx}">0.0h</div></div><div class="p-2"><div class="grid grid-cols-7 gap-1 text-[8px] font-black text-slate-400 text-center uppercase mb-1"><div>Po</div><div>Ut</div><div>St</div><div>Št</div><div>Pi</div><div class="text-orange-400">So</div><div class="text-red-400">Ne</div></div><div class="grid grid-cols-7 gap-1">`;
                
                for(let i=0; i<m.s; i++) h += '<div></div>';
                
                for(let d=1; d<=m.d; d++) {
                    const currDate = new Date(2026, mIdx, d);
                    const dayOfWeek = currDate.getDay(); 
                    const diff = Math.floor((currDate - startDate) / 86400000);
                    let idx = ((diff + teamOffsets[currentTeam]) % 28 + 28) % 28;
                    
                    const shift = cycle[idx];
                    const isHoliday = holidays.includes(`${mIdx}-${d}`);
                    const isPayday = paydays.includes(`${mIdx}-${d}`);
                    const isShut = (mIdx === 3 && d >= 3 && d <= 6) || (mIdx === 6 && d >= 20 && d <= 26) || (mIdx === 11 && d >= 19 && d <= 31);
                    
                    let bg = "bg-slate-50", txt = "text-slate-900", label = shift.t, valH = 0;

                    if(shift.t === 'R') { bg = "bg-[#FFD700]"; txt = "text-black"; valH = 7.5; }
                    else if(shift.t === 'P') { bg = "bg-[#FF8C00]"; txt = "text-white"; valH = 7.5; }
                    else if(shift.t === 'N') { bg = "bg-[#483D8B]"; txt = "text-white"; valH = 7.5; }
                    
                    // Sobota 12h
                    if(dayOfWeek === 6 && (shift.t === 'R' || shift.t === 'N')) {
                        bg = "bg-sky-400"; txt = "text-black"; label = "12"; valH = 11.25;
                    }

                    if(isHoliday || isShut) valH = 0;
                    if(isHoliday) { bg = "bg-red-600"; txt = "text-white"; label = "★"; }
                    else if(isShut) { bg = "bg-red-50 shutdown-pattern"; txt = "text-red-700"; label = "O"; }

                    totalFPC += valH;

                    h += `<div class="h-9 flex flex-col items-center justify-center rounded-xl border border-black/5 shadow-sm relative ${bg} ${txt} text-[11px] font-black">${d}<span class="text-[7px] uppercase tracking-tighter opacity-80">${label !== 'V' ? label : ''}</span>${isPayday ? '<div class="absolute -top-1 -right-1 w-3 h-3 bg-emerald-500 rounded-full border border-white flex items-center justify-center text-[6px] text-white">$</div>' : ''}</div>`;
                }
                monthDiv.innerHTML = h + '</div></div>';
                grid.appendChild(monthDiv);
                document.getElementById(`h-${mIdx}`).innerText = totalFPC.toFixed(1) + "h";
            });
            lucide.createIcons();
        }

        const btnCont = document.getElementById('teamButtons');
        ['A','B','C','D'].forEach(t => {
            const b = document.createElement('button');
            b.innerText = "ZMENA " + t;
            b.className = `flex-1 py-3 rounded-2xl font-black text-[10px] transition-all ${t === currentTeam ? 'bg-orange-500 text-white shadow-lg' : 'bg-white text-slate-400 border'}`;
            b.onclick = () => { 
                currentTeam = t; 
                document.querySelectorAll('#teamButtons button').forEach(btn => {
                    btn.className = `flex-1 py-3 rounded-2xl font-black text-[10px] transition-all bg-white text-slate-400 border`;
                });
                b.className = `flex-1 py-3 rounded-2xl font-black text-[10px] transition-all bg-orange-500 text-white shadow-lg`;
                render(); 
            };
            btnCont.appendChild(b);
        });

        render();
    </script>
</body>
</html>
