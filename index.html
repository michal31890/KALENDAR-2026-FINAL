<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Continental 2026 - FIX 12H</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .shutdown-pattern { 
            background-image: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(239, 68, 68, 0.15) 5px, rgba(239, 68, 68, 0.15) 10px); 
        }
    </style>
</head>
<body class="bg-slate-100">
    <div class="max-w-6xl mx-auto min-h-screen flex flex-col">
        <div class="p-4 bg-white shadow-md border-b sticky top-0 z-50">
            <div class="flex justify-between items-center mb-4">
                <h1 class="font-black text-2xl italic uppercase tracking-tighter text-slate-800">Continental <span class="text-orange-500">2026</span></h1>
                <div class="bg-slate-900 text-white px-4 py-1 rounded-full text-[10px] font-black uppercase">Zmena <span id="activeTeamLabel" class="text-orange-500">C</span></div>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-1" id="teamButtons"></div>
        </div>

        <div class="bg-white flex-grow shadow-xl">
            <div class="p-6 border-b-8 border-orange-500 bg-slate-50 text-center">
                <h2 class="text-4xl font-black text-slate-900 uppercase italic">ZMENA <span id="posterTeamLabel" class="text-orange-500">C</span></h2>
                <p class="text-slate-500 font-bold uppercase tracking-widest text-[9px] mt-1">Ročný plán smien (vrátane 12h ranných/nočných)</p>
            </div>

            <div id="calendarGrid" class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>

            <div class="p-6 bg-slate-900 text-white mt-10 rounded-t-3xl">
                <div class="grid grid-cols-2 md:grid-cols-5 gap-4 text-[10px] font-black uppercase tracking-wider text-center">
                    <div class="flex flex-col items-center gap-1"><div class="w-8 h-8 rounded-lg bg-[#FFD700] text-black flex items-center justify-center shadow-md">R</div>Ranná 8h</div>
                    <div class="flex flex-col items-center gap-1"><div class="w-8 h-8 rounded-lg bg-[#FF8C00] text-white flex items-center justify-center shadow-md">P</div>Poobedná 8h</div>
                    <div class="flex flex-col items-center gap-1"><div class="w-8 h-8 rounded-lg bg-[#483D8B] text-white flex items-center justify-center shadow-md">N</div>Nočná 8h</div>
                    <div class="flex flex-col items-center gap-1"><div class="w-8 h-8 rounded-lg bg-sky-400 text-black flex items-center justify-center shadow-md">12</div>12h Smena</div>
                    <div class="flex flex-col items-center gap-1"><div class="w-8 h-8 rounded-lg bg-red-600 text-white flex items-center justify-center shadow-md">★</div>Sviatok</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTeam = 'C';
        // Definícia cyklu - tu sú ranné (R) aj nočné (N) a ich hodiny
        const cycle = [
            {t:'R',h:8},{t:'R',h:8},{t:'R',h:8},{t:'R',h:8},{t:'N',h:8},{t:'N',h:12},{t:'N',h:8},
            {t:'V',h:0},{t:'V',h:0},{t:'V',h:0},{t:'V',h:0},{t:'R',h:8},{t:'R',h:8},{t:'R',h:8},
            {t:'N',h:8},{t:'N',h:8},{t:'N',h:8},{t:'N',h:8},{t:'V',h:0},{t:'V',h:0},{t:'V',h:0},
            {t:'P',h:8},{t:'P',h:8},{t:'P',h:8},{t:'P',h:8},{t:'P',h:8},{t:'V',h:0},{t:'V',h:0}
        ];
        const teamOffsets = { A: 21, B: 7, C: 0, D: 14 };
        const months = [
            {n:"Január",d:31,s:3},{n:"Február",d:28,s:6},{n:"Marec",d:31,s:6},{n:"Apríl",d:30,s:2},
            {n:"Máj",d:31,s:4},{n:"Jún",d:30,s:0},{n:"Júl",d:31,s:2},{n:"August",d:31,s:5},
            {n:"September",d:30,s:1},{n:"Október",d:31,s:3},{n:"November",d:30,s:6},{n:"December",d:31,s:1}
        ];
        const holidays = ["0-1","0-6","3-3","3-6","4-1","6-5","7-29","10-1","11-24","11-25","11-26"];

        function render() {
            document.getElementById('activeTeamLabel').innerText = currentTeam;
            document.getElementById('posterTeamLabel').innerText = currentTeam;
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const startDate = new Date(2026, 0, 5);

            months.forEach((m, mIdx) => {
                let totalH = 0;
                const monthDiv = document.createElement('div');
                monthDiv.className = "bg-white border-2 border-slate-50 rounded-2xl overflow-hidden shadow-sm";
                let h = `<div class="bg-slate-900 px-3 py-2 flex justify-between items-center"><h3 class="font-black uppercase text-[10px] text-white italic">${m.n}</h3><span class="text-orange-500 text-[10px] font-black" id="h-${mIdx}">0H</span></div><div class="p-2"><div class="grid grid-cols-7 gap-1 text-[8px] font-black text-slate-400 text-center uppercase mb-1"><div>Po</div><div>Ut</div><div>St</div><div>Št</div><div>Pi</div><div class="text-orange-400">So</div><div class="text-orange-400">Ne</div></div><div class="grid grid-cols-7 gap-1">`;
                
                for(let i=0; i<m.s; i++) h += '<div></div>';
                for(let d=1; d<=m.d; d++) {
                    const currDate = new Date(2026, mIdx, d);
                    const diff = Math.round((currDate - startDate) / 86400000);
                    let idx = ((diff + teamOffsets[currentTeam]) % 28 + 28) % 28;
                    const shift = cycle[idx];
                    
                    let bg = "bg-slate-50", txt = "text-slate-900", label = shift.t;

                    // ZÁKLADNÉ FARBY
                    if(shift.t === 'R') bg = "bg-[#FFD700]";
                    else if(shift.t === 'P') { bg = "bg-[#FF8C00]"; txt = "text-white"; }
                    else if(shift.t === 'N') { bg = "bg-[#483D8B]"; txt = "text-white"; }
                    
                    // HLAVNÁ OPRAVA: Akákoľvek smena (R aj N), ktorá má 12 hodín, bude modrá
                    if(shift.h === 12) { 
                        bg = "bg-sky-400"; 
                        txt = "text-black"; 
                        label = "12"; 
                    }
                    
                    const isShut = (mIdx === 3 && d >= 3 && d <= 6) || (mIdx === 6 && d >= 20 && d <= 26) || (mIdx === 11 && d >= 19 && d <= 31);
                    if(isShut) bg += " shutdown-pattern ring-1 ring-red-200";
                    if(holidays.includes(`${mIdx}-${d}`)) { bg = "bg-red-600"; txt = "text-white"; label = "★"; }
                    
                    h += `<div class="h-9 flex flex-col items-center justify-center rounded-lg ${bg} ${txt} text-[10px] font-black border border-black/5 shadow-sm">${d}<span class="text-[7px] font-bold">${label !== 'V' ? label : ''}</span></div>`;
                    if(!holidays.includes(`${mIdx}-${d}`)) totalH += shift.h;
                }
                monthDiv.innerHTML = h + '</div></div>';
                grid.appendChild(monthDiv);
                document.getElementById(`h-${mIdx}`).innerText = totalH + " H";
            });
        }

        const btnCont = document.getElementById('teamButtons');
        ['A','B','C','D'].forEach(t => {
            const b = document.createElement('button');
            b.innerText = t;
            b.className = `flex-1 py-3 rounded-xl font-black text-sm transition-all ${t === currentTeam ? 'bg-orange-500 text-white shadow-lg' : 'bg-white text-slate-400 border'}`;
            b.onclick = () => { currentTeam = t; render(); updateBtns(); };
            btnCont.appendChild(b);
        });

        function updateBtns() {
            document.querySelectorAll('#teamButtons button').forEach(b => {
                const isActive = b.innerText === currentTeam;
                b.className = `flex-1 py-3 rounded-xl font-black text-sm transition-all ${isActive ? 'bg-orange-500 text-white shadow-lg' : 'bg-white text-slate-400 border'}`;
            });
        }
        render();
    </script>
</body>
</html>
