<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Continental 2026 - So 12h / Ne 8h</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .shutdown { background-color: #fee2e2 !important; color: #b91c1c !important; opacity: 0.7; }
        .payday { position: relative; }
        .payday::after {
            content: 'S'; position: absolute; top: -2px; right: -2px;
            background-color: #22c55e; color: white; font-size: 8px;
            width: 12px; height: 12px; display: flex; align-items: center;
            justify-content: center; border-radius: 50%; border: 1px solid white; font-weight: 900;
        }
    </style>
</head>
<body>

    <div class="max-w-6xl mx-auto min-h-screen flex flex-col">
        <div class="p-4 bg-white shadow-sm border-b sticky top-0 z-50 flex justify-between items-center">
            <h1 class="font-black text-xl italic uppercase tracking-tighter text-slate-800 leading-none">
                Continental <span class="text-orange-500">2026</span>
            </h1>
            <div class="flex gap-1" id="teamButtons"></div>
        </div>
        <div id="calendarGrid" class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
    </div>

    <script>
        let currentTeam = 'C';

        const fpcData = {
            A: [157, 150, 165, 165, 157, 165, 172, 168, 150, 168, 165, 161],
            B: [176, 150, 157, 150, 176, 165, 157, 157, 165, 165, 157, 172],
            C: [165, 150, 165, 165, 176, 150, 150, 176, 165, 157, 157, 157],
            D: [168, 150, 172, 165, 176, 150, 165, 157, 165, 157, 157, 150]
        };

        const payDays = { 0: 9, 1: 6, 2: 6, 3: 9, 4: 8, 5: 5, 6: 7, 7: 7, 8: 7, 9: 7, 10: 6, 11: 7 };
        
        const cycle = [
            'R','R','R','R', // Pon-Štv
            'N','N','N',      // Pia-Ned
            'V','V','V','V', // Pon-Štv
            'R','R','R',      // Pia-Ned
            'N','N','N','N', // Pon-Štv
            'V','V','V',      // Pia-Ned
            'P','P','P','P','P', // Pon-Pia
            'V','V'           // So-Ne
        ];

        const teamOffsets = { A: 14, B: 7, C: 0, D: 21 };

        const months = [
            { n: "Január", d: 31, s: 3 }, { n: "Február", d: 28, s: 6 }, { n: "Marec", d: 31, s: 6 },
            { n: "Apríl", d: 30, s: 2 }, { n: "Máj", d: 31, s: 4 }, { n: "Jún", d: 30, s: 0 },
            { n: "Júl", d: 31, s: 2 }, { n: "August", d: 31, s: 5 }, { n: "September", d: 30, s: 1 },
            { n: "Október", d: 31, s: 3 }, { n: "November", d: 30, s: 6 }, { n: "December", d: 31, s: 1 }
        ];

        const holidays = ["0-1", "0-6", "3-3", "3-6", "4-1", "4-8", "6-5", "7-29", "8-1", "8-15", "10-1", "10-17", "11-24", "11-25", "11-26"];

        function render() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const refDate = new Date(2026, 0, 5); // Pondelok 5.1.

            months.forEach((m, mIdx) => {
                const monthDiv = document.createElement('div');
                monthDiv.className = "bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm";
                
                let h = `<div class="bg-slate-900 text-white px-4 py-2.5 flex justify-between items-center"><span class="font-black text-[11px] uppercase tracking-wider">${m.n}</span><span class="bg-orange-500 text-slate-900 text-[10px] px-2.5 py-0.5 rounded-full font-black italic shadow-sm">${fpcData[currentTeam][mIdx]} h</span></div><div class="p-3 grid grid-cols-7 gap-1">`;
                
                for(let i=0; i<m.s; i++) h += '<div></div>';
                
                for(let d=1; d<=m.d; d++) {
                    const currDate = new Date(2026, mIdx, d);
                    const dayW = currDate.getDay(); 
                    const diff = Math.floor((currDate - refDate) / 86400000);
                    
                    let idx = ((diff + teamOffsets[currentTeam]) % 28 + 28) % 28;
                    let type = cycle[idx];
                    
                    let isH = holidays.includes(`${mIdx}-${d}`);
                    let isPay = (payDays[mIdx] === d);
                    let isS = (mIdx === 3 && d >= 3 && d <= 6) || (mIdx === 6 && d >= 20 && d <= 26) || (mIdx === 11 && d >= 21);
                    
                    let bg = "bg-slate-50", txt = "text-slate-900", label = type;

                    if(type === 'R') bg = "bg-[#FFD700]";
                    if(type === 'P') { bg = "bg-[#FF8C00]"; txt = "text-white"; }
                    if(type === 'N') { bg = "bg-[#483D8B]"; txt = "text-white"; }
                    
                    // ŠPECIÁLNA PODMIENKA PRE VÍKENDY
                    if(type === 'R' || type === 'N' || type === 'P') {
                        if(dayW === 6) { // SOBOTA = 12h
                            if(type === 'R') { bg = "bg-sky-400"; txt = "text-slate-900"; }
                            label = "12";
                        }
                        // Nedeľa (dayW === 0) zostáva label = type (teda R, N alebo P), čo je 8h
                    }

                    let labelFinal = label === 'V' ? '' : label;
                    if(isS) bg = "shutdown";
                    if(isH) { bg = "bg-red-600"; txt = "text-white"; labelFinal = "★"; }

                    h += `<div class="h-9 flex flex-col items-center justify-center rounded-xl border border-slate-100 text-[11px] font-black ${bg} ${txt} shadow-sm ${isPay ? 'payday' : ''}">${d}<span class="text-[7px] leading-none mt-0.5">${labelFinal}</span></div>`;
                }
                monthDiv.innerHTML = h + '</div></div>';
                grid.appendChild(monthDiv);
            });
        }

        ['A','B','C','D'].forEach(t => {
            const b = document.createElement('button');
            b.innerText = t;
            b.className = `w-9 h-9 rounded-xl font-black border-2 transition-all ${t === currentTeam ? 'bg-orange-500 border-orange-600 text-white shadow-md' : 'bg-white border-slate-100 text-slate-400'}`;
            b.onclick = () => { currentTeam = t; render(); };
            document.getElementById('teamButtons').appendChild(b);
        });

        render();
    </script>
</body>
</html>
