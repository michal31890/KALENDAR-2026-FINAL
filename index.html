<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Continental 2026 - FINAL FIX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* EXTRA VÝRAZNÁ ODSTÁVKA */
        .shutdown-active { 
            background-color: #fee2e2 !important; /* jemná červená podklad */
            background-image: repeating-linear-gradient(45deg, transparent, transparent 8px, rgba(220, 38, 38, 0.5) 8px, rgba(220, 38, 38, 0.5) 16px) !important;
            border: 2px solid #dc2626 !important;
            color: #991b1b !important;
        }
    </style>
</head>
<body class="bg-slate-200">
    <div class="max-w-6xl mx-auto min-h-screen flex flex-col">
        <div class="p-4 bg-white shadow-xl border-b-4 border-orange-500 sticky top-0 z-50 print-hidden">
            <div class="flex justify-between items-center mb-4">
                <h1 class="font-black text-2xl italic uppercase tracking-tighter text-slate-800">
                    Continental <span class="text-orange-500 text-3xl">2026</span>
                </h1>
                <div class="bg-slate-900 text-white px-5 py-2 rounded-full text-xs font-black uppercase tracking-widest">
                    Zmena <span id="activeTeamLabel" class="text-orange-500 text-lg">C</span>
                </div>
            </div>
            <div class="flex gap-2 overflow-x-auto pb-1" id="teamButtons"></div>
        </div>

        <div class="bg-white flex-grow shadow-2xl">
            <div id="calendarGrid" class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

            <div class="p-8 bg-slate-900 text-white mt-10 rounded-t-3xl">
                <div class="grid grid-cols-2 md:grid-cols-5 gap-6 text-[11px] font-black uppercase tracking-wider text-center">
                    <div class="flex flex-col items-center gap-2"><div class="w-12 h-12 rounded-xl bg-[#FFD700] text-black flex items-center justify-center border-2 border-white/20 shadow-lg">R</div>Ranná 8h</div>
                    <div class="flex flex-col items-center gap-2"><div class="w-12 h-12 rounded-xl bg-[#FF8C00] text-white flex items-center justify-center border-2 border-white/20 shadow-lg">P</div>Poob. 8h</div>
                    <div class="flex flex-col items-center gap-2"><div class="w-12 h-12 rounded-xl bg-[#483D8B] text-white flex items-center justify-center border-2 border-white/20 shadow-lg">N</div>Nočná 8h</div>
                    <div class="flex flex-col items-center gap-2"><div class="w-12 h-12 rounded-xl bg-cyan-400 text-black flex items-center justify-center border-2 border-black font-black text-lg">12</div>12h SOBOTA</div>
                    <div class="flex flex-col items-center gap-2"><div class="w-12 h-12 rounded-xl bg-red-600 text-white flex items-center justify-center border-2 border-white/20 shadow-lg">★</div>Sviatok</div>
                </div>
                <div class="mt-10 pt-6 border-t border-slate-800 flex flex-col items-center gap-4">
                    <div class="flex items-center gap-4 text-xs font-bold uppercase italic text-slate-400">
                        <span class="flex items-center gap-2"><div class="w-5 h-5 rounded border border-red-600 shutdown-active"></div> Odstávka: 20.7. - 26.7. / 19.12. - 31.12.</span>
                    </div>
                    <button onclick="window.print()" class="px-10 py-4 bg-orange-600 hover:bg-orange-500 text-white rounded-2xl font-black uppercase tracking-widest text-xs transition-all shadow-lg active:scale-95 print-hidden">Tlačiť Plán</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTeam = 'C';
        const cycle = [
            {t:'R',h:8},{t:'R',h:8},{t:'R',h:8},{t:'R',h:8},{t:'N',h:8},{t:'N',h:8},{t:'N',h:8},
            {t:'V',h:0},{t:'V',h:0},{t:'V',h:0},{t:'V',h:0},{t:'R',h:8},{t:'R',h:8},{t:'R',h:8},
            {t:'N',h:8},{t:'N',h:8},{t:'N',h:8},{t:'N',h:8},{t:'V',h:0},{t:'V',h:0},{t:'V',h:0},
            {t:'P',h:8},{t:'P',h:8},{t:'P',h:8},{t:'P',h:8},{t:'P',h:8},{t:'V',h:0},{t:'V',h:0}
        ];
        const teamOffsets = { A: 21, B: 7, C: 0, D: 14 };
        const months = [
            {n:"Január",d:31,s:3},{n:"Február",d:28,s:6},{n:"Marec",d:31,s:6},{n:"Apríl",d:30,s:2},
            {n:"Máj",d:31,s:4},{n:"Jún",d:30,s:0},{n:"Júl",d:31,s:2},{n:"August",d:31,s:5},
            {n:"September",d:30,s:1},{n:"Október",d:31,s:3},{n:"November",d:30,s:6},{n:"December",d:31,s:1}
        ];
        const holidays = ["0-1","0-6","3-3","3-6","4-1","6-5","7-29","10-1","11-24","11-25","11-26"];

        function render() {
            document.getElementById('activeTeamLabel').innerText = currentTeam;
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const startDate = new Date(2026, 0, 5);

            months.forEach((m, mIdx) => {
                let totalH = 0;
                const monthDiv = document.createElement('div');
                monthDiv.className = "bg-white border-4 border-slate-100 rounded-3xl overflow-hidden shadow-md";
                let h = `<div class="bg-slate-900 px-4 py-3 flex justify-between items-center"><h3 class="font-black uppercase text-xs text-white italic tracking-tighter">${m.n}</h3><span class="bg-orange-500 text-black text-xs px-2 py-0.5 rounded font-black" id="h-${mIdx}">0H</span></div><div class="p-2"><div class="grid grid-cols-7 gap-1 text-[10px] font-black text-slate-400 text-center uppercase mb-2"><div>Po</div><div>Ut</div><div>St</div><div>Št</div><div>Pi</div><div class="text-orange-500">So</div><div class="text-orange-400">Ne</div></div><div class="grid grid-cols-7 gap-1">`;
                
                for(let i=0; i<m.s; i++) h += '<div></div>';
                for(let d=1; d<=m.d; d++) {
                    const currDate = new Date(2026, mIdx, d);
                    const dayOfWeek = currDate.getDay(); // 6 = Sobota, 0 = Nedeľa
                    const diff = Math.round((currDate - startDate) / 86400000);
                    let idx = ((diff + teamOffsets[currentTeam]) % 28 + 28) % 28;
                    const shift = cycle[idx];
                    
                    let bg = "bg-slate-100", txt = "text-slate-900", label = shift.t, hours = shift.h;

                    if(shift.t === 'R') bg = "bg-[#FFD700]";
                    else if(shift.t === 'P') { bg = "bg-[#FF8C00]"; txt = "text-white"; }
                    else if(shift.t === 'N') { bg = "bg-[#483D8B]"; txt = "text-white"; }
                    
                    // IBA SOBOTA JE 12-KA (ak máš rannú alebo nočnú)
                    if(dayOfWeek === 6 && (shift.t === 'R' || shift.t === 'N')) {
                        bg = "bg-cyan-400"; 
                        txt = "text-black"; 
                        label = "12";
                        hours = 12;
                    }
                    
                    // ODSTÁVKY (Apríl 3-6, Júl 20-26, December 19-31)
                    const isShut = (mIdx === 3 && d >= 3 && d <= 6) || 
                                   (mIdx === 6 && d >= 20 && d <= 26) || 
                                   (mIdx === 11 && d >= 19 && d <= 31);

                    if(isShut) bg = "shutdown-active";
                    if(holidays.includes(`${mIdx}-${d}`)) { bg = "bg-red-600"; txt = "text-white"; label = "★"; }
                    
                    h += `<div class="h-11 flex flex-col items-center justify-center rounded-xl ${bg} ${txt} text-[11px] font-black shadow-sm relative">${d}<span class="text-[8px] uppercase tracking-tighter">${label !== 'V' ? label : ''}</span></div>`;
                    if(!holidays.includes(`${mIdx}-${d}`)) totalH += hours;
                }
                monthDiv.innerHTML = h + '</div></div>';
                grid.appendChild(monthDiv);
                document.getElementById(`h-${mIdx}`).innerText = totalH + " H";
            });
        }

        const btnCont = document.getElementById('teamButtons');
        ['A','B','C','D'].forEach(t => {
            const b = document.createElement('button');
            b.innerText = t;
            b.className = `flex-1 py-4 rounded-2xl font-black text-lg transition-all ${t === currentTeam ? 'bg-orange-500 text-white shadow-xl scale-105' : 'bg-white text-slate-400 border-2'}`;
            b.onclick = () => { currentTeam = t; render(); updateBtns(); };
            btnCont.appendChild(b);
        });

        function updateBtns() {
            document.querySelectorAll('#teamButtons button').forEach(b => {
                const isActive = b.innerText === currentTeam;
                b.className = `flex-1 py-4 rounded-2xl font-black text-lg transition-all ${isActive ? 'bg-orange-500 text-white shadow-xl scale-105' : 'bg-white text-slate-400 border-2'}`;
            });
        }
        render();
    </script>
</body>
</html>
