<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Continental 2026 - Pevný Fond</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body>

    <div class="max-w-6xl mx-auto min-h-screen flex flex-col">
        <div class="p-4 bg-white shadow-sm border-b sticky top-0 z-50 flex justify-between items-center">
            <h1 class="font-black text-xl italic uppercase tracking-tighter text-slate-800 leading-none">
                Continental <span class="text-orange-500">2026</span>
            </h1>
            <div class="flex gap-1" id="teamButtons"></div>
        </div>

        <div id="calendarGrid" class="p-4 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4"></div>
    </div>

    <script>
        let currentTeam = 'C';

        // PRESNE TIETO ČÍSLA SA ZOBRAZIA (BEZ PRERÁTAVANIA)
        const fpcData = {
            A: [157, 150, 165, 165, 157, 165, 172, 168, 150, 168, 165, 161],
            B: [176, 150, 157, 150, 176, 165, 157, 157, 165, 165, 157, 172],
            C: [165, 150, 165, 165, 176, 150, 150, 176, 165, 157, 157, 157],
            D: [168, 150, 172, 165, 176, 150, 165, 157, 165, 157, 157, 150]
        };
        
        const cycle = ['R','R','R','N','N','N','N','V','V','V','P','P','P','P','P','V','V','R','R','R','R','N','N','N','V','V','V','V'];
        const teamOffsets = { A: 14, B: 7, C: 27, D: 21 };

        const months = [
            { n: "Január", d: 31, s: 3 }, { n: "Február", d: 28, s: 6 }, { n: "Marec", d: 31, s: 6 },
            { n: "Apríl", d: 30, s: 2 }, { n: "Máj", d: 31, s: 4 }, { n: "Jún", d: 30, s: 0 },
            { n: "Júl", d: 31, s: 2 }, { n: "August", d: 31, s: 5 }, { n: "September", d: 30, s: 1 },
            { n: "Október", d: 31, s: 3 }, { n: "November", d: 30, s: 6 }, { n: "December", d: 31, s: 1 }
        ];

        const holidays = ["0-1", "0-6", "3-3", "3-6", "4-1", "4-8", "6-5", "7-29", "8-1", "8-15", "10-1", "10-17", "11-24", "11-25", "11-26"];

        function render() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            const startDate = new Date(2026, 0, 1);

            months.forEach((m, mIdx) => {
                const monthDiv = document.createElement('div');
                monthDiv.className = "bg-white border border-slate-200 rounded-3xl overflow-hidden shadow-sm";
                
                const currentFPC = fpcData[currentTeam][mIdx];

                let h = `
                    <div class="bg-slate-900 text-white px-4 py-2.5 flex justify-between items-center border-b border-slate-800">
                        <span class="font-black text-[11px] uppercase tracking-wider">${m.n}</span>
                        <span class="bg-orange-500 text-slate-900 text-[10px] px-2.5 py-0.5 rounded-full font-black shadow-sm italic">
                            ${currentFPC} h
                        </span>
                    </div>
                    <div class="p-3 grid grid-cols-7 gap-1">
                `;
                
                for(let i=0; i<m.s; i++) h += '<div></div>';
                
                for(let d=1; d<=m.d; d++) {
                    const currDate = new Date(2026, mIdx, d);
                    const dayW = currDate.getDay(); 
                    const diff = Math.floor((currDate - startDate) / 86400000);
                    let idx = ((diff + teamOffsets[currentTeam]) % 28 + 28) % 28;
                    
                    let type = cycle[idx];
                    let isH = holidays.includes(`${mIdx}-${d}`);
                    
                    let bg = "bg-slate-50", txt = "text-slate-900", label = type;

                    if(type === 'R') bg = "bg-[#FFD700]";
                    if(type === 'P') { bg = "bg-[#FF8C00]"; txt = "text-white"; }
                    if(type === 'N') { bg = "bg-[#483D8B]"; txt = "text-white"; }
                    
                    if(dayW === 6 && (type === 'R' || type === 'N')) {
                        bg = "bg-sky-400"; txt = "text-slate-900"; label = "12";
                    }

                    let labelFinal = label === 'V' ? '' : label;
                    if(isH) { labelFinal += "★"; }

                    h += `
                        <div class="h-9 flex flex-col items-center justify-center rounded-xl border border-slate-100 text-[11px] font-black ${bg} ${txt} shadow-sm">
                            ${d}<span class="text-[7px] leading-none mt-0.5">${labelFinal}</span>
                        </div>
                    `;
                }
                monthDiv.innerHTML = h + '</div></div>';
                grid.appendChild(monthDiv);
            });
        }

        ['A','B','C','D'].forEach(t => {
            const b = document.createElement('button');
            b.innerText = t;
            b.className = `w-9 h-9 rounded-xl font-black border-2 transition-all shadow-sm ${t === currentTeam ? 'bg-orange-500 border-orange-600 text-white' : 'bg-white border-slate-100 text-slate-400 hover:bg-slate-50'}`;
            b.onclick = () => { 
                currentTeam = t; 
                document.querySelectorAll('#teamButtons button').forEach(btn => btn.className = 'w-9 h-9 rounded-xl font-black border-2 bg-white border-slate-100 text-slate-400 hover:bg-slate-50 shadow-sm');
                b.className = 'w-9 h-9 rounded-xl font-black border-2 bg-orange-500 border-orange-600 text-white shadow-md scale-110';
                render(); 
            };
            document.getElementById('teamButtons').appendChild(b);
        });

        render();
    </script>
</body>
</html>
